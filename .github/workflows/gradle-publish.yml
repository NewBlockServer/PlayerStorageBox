name: Gradle 提交自动构建

on:
  workflow_dispatch:
  push:
    branches:
      - main
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 授予 gradlew 执行权限
        run: chmod +x gradlew

      - name: Gradle 构建
        run: ./gradlew build --parallel --build-cache --daemon

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-arm
          path: build/libs/*.jar

      - name: 发布到 GitHub Packages
        if: github.event_name == 'release'
        run: ./gradlew publish --parallel --build-cache
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

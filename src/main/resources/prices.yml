combinations:
  combo_fire_set:
    # 必须包含以下所有 Lore (部分匹配即可，只要这行文字存在于 Lore 中)
    required-lore:
      - "测试1 III"
      - "测试2 III"
    # 满足上述 Lore 后，基础价值乘以这个数
    lore-multiplier: 2.0

    # [可选] 必须叫这个名字
    required-name: "&c火焰剑"
    # 如果 Lore 满足 且 名字也满足，在 lore-multiplier 的基础上再乘以这个数
    # 最终倍率 = 1.5 * 2.0 = 3.0
    name-multiplier: 2.0